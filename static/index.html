<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Sobrevivirías al apocalipsis zombi?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Oswald:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/estilos.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
  <header>
    <p class="etiqueta">Informe de campo n.º 0042</p>
    <h1>¿Sobrevivirías al apocalipsis zombi?</h1>
  </header>

  <main>
    <form id="formulario">
      <h2>Tu perfil</h2>

      <label>
        <span class="fila">Edad <output id="edad-valor"></output></span>
        <input type="range" id="edad" min="15" max="80" value="28">
      </label>
      <label>
        <span class="fila">Forma física (1-10) <output id="forma_fisica-valor"></output></span>
        <input type="range" id="forma_fisica" min="1" max="10" value="5">
      </label>
      <label>
        <span class="fila">Pelis de zombis vistas <output id="pelis_zombis-valor"></output></span>
        <input type="range" id="pelis_zombis" min="0" max="59" value="20">
      </label>
      <label>
        <span class="fila">Horas de sueño <output id="horas_sueno-valor"></output></span>
        <input type="range" id="horas_sueno" min="3" max="10" step="0.5" value="7">
      </label>

      <div class="checks">
        <label class="check"><input type="checkbox" id="sabe_conducir"> Sé conducir</label>
        <label class="check"><input type="checkbox" id="mascota"> Tengo mascota</label>
        <label class="check"><input type="checkbox" id="vive_en_campo"> Vivo en el campo</label>
        <label class="check"><input type="checkbox" id="primeros_auxilios"> Sé primeros auxilios</label>
      </div>
    </form>

    <section id="resultado">
      <h2>Veredicto</h2>
      <p id="titulo">...</p>
      <p class="grande"><span id="probabilidad">--</span>%</p>
      <p id="percentil"></p>
      <div class="grafico grafico-radar"><canvas id="radar"></canvas></div>
    </section>
  </main>
  <section class="ancho">
    <h2>Qué te está matando</h2>
    <p class="nota">Puntos de supervivencia que ganarías si arreglaras solo esa variable.</p>
    <p id="sin-lastres" hidden>Nada te está matando. Sospechoso.</p>
    <div class="grafico grafico-letales"><canvas id="letales"></canvas></div>
  </section>

  <section class="ancho">
    <h2>Qué pesa más en el modelo</h2>
    <div class="grafico grafico-barras"><canvas id="barras"></canvas></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="/static/script.js"></script>
</body>
</html>
